appId: swmansion.enriched.markdown.example
# After setValue, typing at the document end must use plain paragraph styles,
# not inherit bold/heading typing attributes from imported markdown.
# Capture/update goldens with:
# yarn test:e2e:ios:update-screenshots -- .maestro/enrichedMarkdownInput/flows/basic/block_elements/import_reset_typing_attributes_test.yaml
tags:
  - input
  - block
  - ios-only
---
- launchApp

- runFlow:
    file: '../../../../subflows/move_to_playground.yaml'

- tapOn:
    id: set-markdown-button

- tapOn:
    id: set-markdown-input

- inputText: '# Title'
- pressKey: Enter
- inputText: 'Body **bold** end'

- tapOn:
    id: set-markdown-confirm

- tapOn:
    id: focus-button

- tapOn:
    id: editor-container

- inputText: ' plain'

- tapOn:
    id: blur-button

- runFlow:
    file: '../../../subflows/capture_or_assert_screenshot.yaml'
    env:
      SCREENSHOT_NAME: 'import_reset_typing_attributes_input'
